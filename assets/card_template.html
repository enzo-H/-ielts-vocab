<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<title>IELTS vocab session</title>
<style>
  /* 固定深色主题：自带背景，不依赖 prefers-color-scheme（预览面板会误报浅色） */
  :root{
    --bg:#1e1e1e; --fg:#f0f0f0; --sub:#d0d0d0; --aux:#a8a8a8;
    --border:#666; --card-border:#555;
  }
  html,body{background:var(--bg)}
  body{
    color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    font-size:13px; line-height:1.65;
    margin:0; padding:12px;
  }
  .wrap{max-width:560px;margin:0 auto}
  .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--aux);margin-bottom:6px}
  .card{border:0.5px solid var(--card-border);border-radius:10px;padding:14px 16px}
  .word{font-size:17px;font-weight:500;cursor:pointer;display:inline-block}
  .phon{font-size:12px;color:var(--sub);margin-top:2px}
  .cn{font-size:13px;margin-top:10px}
  .sen{font-size:13px;color:var(--sub);font-style:italic;margin-top:6px}
  .sen-cn{font-size:12px;color:var(--aux);margin-top:2px}
  .para{font-size:12px;color:var(--sub);margin-top:10px}
  .btn-row{display:flex;gap:6px;margin-top:10px}
  button{
    flex:1;font:inherit;font-size:12px;
    padding:5px 8px;
    background:transparent;color:inherit;
    border:0.5px solid var(--border);border-radius:6px;
    cursor:pointer;opacity:.9;
  }
  button:hover{opacity:.6}
  button:disabled{cursor:default;opacity:.5}
  .btn-wide{flex:none;padding:5px 16px}
  .done{text-align:center}
  .done-title{font-size:14px;font-weight:500}
  textarea{
    width:100%;box-sizing:border-box;height:56px;font:inherit;font-size:11px;
    background:transparent;color:inherit;resize:none;
    border:0.5px solid var(--border);border-radius:6px;padding:6px;margin-top:10px;
  }
  .hint{font-size:12px;color:var(--sub);margin-top:8px}
</style>
</head>
<body>
<!-- ============================================================
  ielts-vocab 交互学习页模板（Agent 复制本文件并替换占位符）
  替换项：
    {{WORDS_JSON}} 词对象数组 JSON，字段与 wordlist_*.json 一致
  交互流程：
    1. 逐词展示卡片（词 + 音标 + 释义 + 例句 + 同义替换）
    2. 每词 4 个自评按钮：Again(忘了) / Hard(困难) / Good(一般) / Easy(轻松)
    3. 结束后生成 grade 字符串，如 "habitat=good,deposit=again"
    4. 点"保存学习记录"→ fetch POST http://127.0.0.1:{8765-8767}/record 自动入库
       （本地桥接服务：session.py serve；不可用时回退剪贴板方式）
  样式规范（用户定稿 2026-08-31）：
    透明按钮 + prefers-color-scheme 自适应明暗 + 紧凑字号（单词 17px，正文 13px）
============================================================ -->
<div id="app"></div>
<script>
const WORDS = {{WORDS_JSON}};
let i = 0, results = [];

function speak(t){ try{ const u = new SpeechSynthesisUtterance(t); u.lang='en-GB'; speechSynthesis.speak(u);}catch(e){} }

function render(){
  if(i >= WORDS.length) return finish();
  const w = WORDS[i];
  document.getElementById('app').innerHTML = `
    <div class="wrap">
      <div class="meta"><span>${i+1} / ${WORDS.length}</span><span>${w.list||''}</span></div>
      <div class="card">
        <div class="word" onclick="speak('${w.word.replace(/'/g,"\\'")}')">${w.word} 🔊</div>
        <div class="phon">${w.phonetic||''} ${w.pos||''}</div>
        <div class="cn">${w.cn||''}</div>
        <div class="sen">${w.sentence||''}</div>
        <div class="sen-cn">${w.sentence_cn||''}</div>
        <div class="para">同义替换：${(w.paraphrase||[]).join(' / ')}</div>
      </div>
      <div class="btn-row">
        <button onclick="grade('again')">Again 忘了</button>
        <button onclick="grade('hard')">Hard 困难</button>
        <button onclick="grade('good')">Good 记得</button>
        <button onclick="grade('easy')">Easy 轻松</button>
      </div>
    </div>`;
}

function grade(g){ results.push(WORDS[i].id + '=' + g); i++; render(); }

function finish(){
  const payload = results.join(',');
  document.getElementById('app').innerHTML = `
    <div class="wrap">
      <div class="card done">
        <div class="done-title">本轮完成</div>
        <div style="font-size:12px;color:var(--sub);margin:4px 0">${results.length} 个词已自评</div>
        <textarea id="payload" readonly>${payload}</textarea>
        <div class="btn-row" style="justify-content:center;margin-top:8px">
          <button id="saveBtn" class="btn-wide" onclick="saveResult()">保存学习记录</button>
          <button class="btn-wide" onclick="copyPayload()">复制结果串</button>
        </div>
        <div id="hint" class="hint" style="display:none"></div>
      </div>
    </div>`;
}

function saveResult(){
  const p = document.getElementById('payload').value;
  const msg = document.getElementById('hint');
  msg.style.display = 'block';
  msg.textContent = '正在保存…';
  postBridge(p).then(ok => {
    if(ok){
      msg.textContent = '已保存到学习记录（自动入库，无需其他操作）';
      const btn = document.getElementById('saveBtn');
      if(btn){ btn.textContent = '已保存'; btn.disabled = true; }
    }else{
      copyPayload();
      msg.textContent = '此环境禁止自动保存：结果串已复制，请粘贴到对话框发送';
    }
  });
}

function postBridge(payload){
  const ports = [8765, 8766, 8767];
  return tryPort(0);
  function tryPort(i){
    if(i >= ports.length) return Promise.resolve(false);
    return fetch('http://127.0.0.1:' + ports[i] + '/record', {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({results: payload})
    }).then(r => r.json())
      .then(j => !!(j && (j.ok || (j.recorded && j.recorded.length))))
      .catch(() => tryPort(i + 1));
  }
}

function copyPayload(){
  const ta = document.getElementById('payload');
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  if (navigator.clipboard) navigator.clipboard.writeText('请记录学习结果：' + ta.value).catch(()=>{});
}

render();
</script>
</body>
</html>
